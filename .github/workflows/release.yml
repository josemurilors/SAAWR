name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: cargo build -p awr-desktop --release
      - name: Pack
        shell: pwsh
        run: |
          Copy-Item target/release/awr-desktop.exe SA-AWR.exe
          Compress-Archive -Force SA-AWR.exe "SA-AWR-${{ github.ref_name }}-windows.zip"
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" "SA-AWR-${{ github.ref_name }}-windows.zip" --clobber
          } else {
            gh release create "${{ github.ref_name }}" "SA-AWR-${{ github.ref_name }}-windows.zip" --title "SA-AWR ${{ github.ref_name }}" --generate-notes
          }
