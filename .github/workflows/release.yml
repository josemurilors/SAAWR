name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: cargo build -p awr-desktop --release
      - name: Pack
        shell: pwsh
        run: |
          Copy-Item target/release/awr-desktop.exe SA-AWR.exe
          Compress-Archive -Force SA-AWR.exe "SA-AWR-${{ github.ref_name }}-windows.zip"
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" "SA-AWR-${{ github.ref_name }}-windows.zip" --clobber
          } else {
            gh release create "${{ github.ref_name }}" "SA-AWR-${{ github.ref_name }}-windows.zip" --title "SA-AWR ${{ github.ref_name }}" --generate-notes
          }

  linux:
    # after windows, which creates the release, so the two jobs never race to create it
    needs: windows
    # oldest supported runner: the AppImage runs on distros with this glibc or newer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: ui
      # from the root, the CLI finds crates/awr-desktop/tauri.conf.json; it builds the ui itself (beforeBuildCommand)
      - run: ui/node_modules/.bin/tauri build --bundles appimage
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="SA-AWR-${{ github.ref_name }}-linux-x86_64.AppImage"
          cp target/release/bundle/appimage/*.AppImage "$f"
          gh release upload "${{ github.ref_name }}" "$f" --clobber
