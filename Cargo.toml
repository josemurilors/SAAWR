[workspace]
members = ["crates/*"]
# awr-desktop needs the built front end (ui/dist), so it is built on purpose: `cargo build -p awr-desktop`
default-members = ["crates/awr-core", "crates/awr-cli"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
awr-core = { path = "crates/awr-core" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
directories = "6"
tracing = "0.1"
tempfile = "3"
